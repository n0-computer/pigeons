[package]
name = "pigeons-mobile"
description = "Rust core for the pigeons iOS app: dials a roost over iroh, speaks SSH to it, and drives tmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "pigeons_mobile"
crate-type = ["staticlib", "rlib"]

# This crate is its own workspace root so its mobile-only dependencies (russh
# and friends) stay out of the main crate's lockfile, CI, and cargo-deny run.
[workspace]

[dependencies]
iroh-pigeons = { path = "../.." }
iroh = "1"
russh = { version = "0.65", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
russh-sftp = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# Pinned: libc 0.2.190 moved the BSD routing-socket constants (RTM_*, RTAX_*,
# RTA_IFP, RTF_*) behind `target_os = "macos"`, and netwatch 0.19 still uses
# them on every Apple target, so iOS builds fail with newer libc. iroh 1.5
# moved to netwatch 0.20, which defines them itself, but iroh-services 2.0
# still pulls portmapper 0.19 -> netwatch 0.19. This pin holds the whole
# graph at 0.2.189; lift once nothing in the graph needs netwatch 0.19.
libc = "=0.2.189"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# netdev 0.46.3 (via iroh-services -> portmapper 0.19 -> netwatch 0.19) uses
# `libc::in6_ifreq`, which libc only defines for macOS, so the iOS targets
# fail to compile. The fix (shellrow/netdev b3bfb0f, "fix(ios): use only
# public APIs on iOS") shipped as 0.47.0, which netwatch 0.19 does not
# accept; iroh 1.5's netwatch 0.20 already uses 0.47. Patch to the fix
# commit, which still carries version 0.46.3; drop once nothing in the graph
# needs netwatch 0.19.
[patch.crates-io]
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }
