[package]
name = "pigeons-mobile"
description = "Rust core for the pigeons iOS app: dials a roost over iroh, speaks SSH to it, and drives tmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "pigeons_mobile"
crate-type = ["staticlib", "rlib"]

# This crate is its own workspace root so its mobile-only dependencies (russh
# and friends) stay out of the main crate's lockfile, CI, and cargo-deny run.
[workspace]

[dependencies]
iroh-pigeons = { path = "../.." }
iroh = "1"
# Pinned: russh 0.62+ wants a stable ed25519-dalek 3, while iroh-services 1.0
# pins 3.0.0-rc.0, and cargo will not unify a prerelease with `^3`. Lift the pin
# once the main crate moves to iroh-services 2 (ed25519-dalek >=3.0.0-rc.0).
russh = { version = "=0.61.2", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
tempfile = "3"
serde_json = "1"

# netdev 0.46.3 (via iroh -> netwatch/portmapper) uses `libc::in6_ifreq`,
# which libc only defines for macOS, so the iOS targets fail to compile.
# The fix (shellrow/netdev b3bfb0f, "fix(ios): use only public APIs on iOS")
# shipped as 0.47.0, which netwatch does not accept yet. Patch to the fix
# commit, which still carries version 0.46.3; drop once iroh's netwatch
# requires netdev >= 0.47.
[patch.crates-io]
netdev = { git = "https://github.com/shellrow/netdev", rev = "b3bfb0fb5595cd143bfa0b9f07d1ad6e0ef0c313" }
