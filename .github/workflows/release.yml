name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""
      create_release:
        description: "Create release"
        required: true
        default: "true"
      upload_artifacts:
        description: "Upload artifacts"
        required: true
        default: "true"
      base_hash:
        description: "Commit hash from which to build"
        required: false
        type: string
        default: ""
      mark_latest:
        description: "Mark latest release"
        required: true
        default: "false"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BIN_NAME: pigeons
  IROH_FORCE_STAGING_RELAYS: "1"

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ env.RELEASE_VERSION }}
    steps:
      - name: Get the release version from the tag (push)
        shell: bash
        if: env.RELEASE_VERSION == '' && github.event_name == 'push'
        run: |
          echo "RELEASE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "version is: ${{ env.RELEASE_VERSION }}"
      - name: Get the release version from the tag (dispatch)
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "RELEASE_VERSION=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV
          echo "version is: ${{ env.RELEASE_VERSION }}"
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Create GitHub release
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: ${{ env.RELEASE_VERSION }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: build-release
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name:
          [
            ubuntu-latest,
            ubuntu-arm-latest,
            macOS-arm-latest,
            macOS-latest,
            windows-latest,
          ]
        rust: [stable]
        include:
          - name: ubuntu-arm-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: aarch64
            target: linux-aarch64
            cargo_targets: "aarch64-unknown-linux-musl"
            runner: [self-hosted, linux, ARM64]
          - name: ubuntu-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: amd64
            target: linux-x86_64
            cargo_targets: "x86_64-unknown-linux-musl"
            runner: [self-hosted, linux, X64]
          - name: macOS-latest
            os: macOS-latest
            release-os: darwin
            release-arch: x86_64
            target: darwin-x86_64
            cargo_targets: "x86_64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
          - name: macOS-arm-latest
            os: macOS-latest
            release-os: darwin
            release-arch: aarch64
            target: darwin-aarch64
            cargo_targets: "aarch64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
          # TODO: windows runner is not available on the org level
          - name: windows-latest
            os: windows-latest
            release-os: windows
            release-arch: amd64
            target: windows-x86_64
            cargo_targets: "x86_64-pc-windows-msvc"
            runner: [windows-latest]
    steps:
      - name: Checkout repository
        if: inputs.base_hash == ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Checkout specified commit
        if: inputs.base_hash != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.base_hash }}
          fetch-depth: 1

      - name: Set build arch
        shell: bash
        run: |
          echo "RELEASE_ARCH=${{ matrix.release-arch }}" >> $GITHUB_ENV
          echo "RELEASE_OS=${{ matrix.release-os }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.cargo_targets }}

      - name: Ensure musl support
        if: ${{ contains(matrix.cargo_targets, '-musl') }}
        run: sudo apt-get install musl-tools -y

      - name: Build release binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          BUILD_IROH_SERVICES_API_SECRET: ${{ secrets.BUILD_IROH_SERVICES_API_SECRET }}
        run: |
          if [ "${{ matrix.name }}" = "ubuntu-arm-latest" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            export CC=aarch64-linux-gnu-gcc
          fi
          if [ "${{ contains(matrix.cargo_targets, '-musl') }}" = "true" ]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
          fi
          cargo build --release --target ${{ matrix.cargo_targets }}

      - name: Build release binary (windows)
        if: matrix.os == 'windows-latest'
        env:
          BUILD_IROH_SERVICES_API_SECRET: ${{ secrets.BUILD_IROH_SERVICES_API_SECRET }}
        run: cargo build --release --target ${{ matrix.cargo_targets }}

      - name: Cache AWS CLI
        if: matrix.os != 'windows-latest'
        id: cache-awscli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/awscli
          key: awscli-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Download awscli (linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'amd64' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o ~/awscli/awscliv2.zip
          cd ~/awscli && unzip -oq awscliv2.zip

      - name: Download awscli (linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'aarch64' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o ~/awscli/awscliv2.zip
          cd ~/awscli && unzip -oq awscliv2.zip

      - name: Download awscli (mac)
        if: matrix.os == 'macos-latest' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o ~/awscli/AWSCLIV2.pkg

      - name: Install awscli (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo ~/awscli/aws/install --update

      - name: Install awscli (mac)
        if: matrix.os == 'macos-latest'
        run: sudo installer -pkg ~/awscli/AWSCLIV2.pkg -target /

      - name: Set AWS credentials
        if: matrix.os != 'windows-latest'
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-west-2" >> $GITHUB_ENV

      - name: Push release to S3
        if: matrix.os != 'windows-latest' && (github.event.inputs.upload_artifacts == 'true' || github.event_name == 'push')
        run: |
          aws s3 cp ./target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }} \
            s3://vorc/${{ env.BIN_NAME }}-${RELEASE_OS}-${RELEASE_ARCH}-${GITHUB_SHA::7} --no-progress

      - name: Push latest to S3
        if: matrix.os != 'windows-latest' && (github.event.inputs.mark_latest == 'true' || github.event_name == 'push')
        run: |
          aws s3 cp ./target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }} \
            s3://vorc/${{ env.BIN_NAME }}-${RELEASE_OS}-${RELEASE_ARCH}-latest --no-progress

      - name: Build archive
        shell: bash
        run: |
          staging="${{ env.BIN_NAME }}-${{ needs.create-release.outputs.release_version }}-${{ matrix.target }}"
          mkdir -p "$staging"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }}.exe" "$staging/"
            cd "$staging"
            7z a "../$staging.zip" .
            echo "ASSET=$staging.zip" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }}" "$staging/"
            tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload release archive to GitHub
        if: github.event.inputs.upload_artifacts == 'true' || github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.create-release.outputs.release_version }}
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-install-script:
    name: publish-install-script
    needs: build-release
    runs-on: ubuntu-latest
    if: github.event.inputs.mark_latest == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
      - name: Set AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-west-2" >> $GITHUB_ENV
      - name: Upload install script to S3
        run: |
          aws s3 cp ./install.sh s3://vorc/pigeons-install.sh \
            --no-progress --content-type "text/plain"
