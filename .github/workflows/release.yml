name: release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version"
        required: true
        default: ""
      create_release:
        description: "Create release"
        required: true
        default: "true"
      upload_artifacts:
        description: "Upload artifacts"
        required: true
        default: "true"
      upload_url:
        description: "Upload URL of an existing release, when create_release is false"
        required: false
        default: ""
      base_hash:
        description: "Commit hash from which to build"
        required: false
        type: string
        default: ""
      mark_latest:
        description: "Mark latest release"
        required: true
        default: "false"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BIN_NAME: pigeons
  IROH_FORCE_STAGING_RELAYS: "1"

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  create-release:
    permissions:
      contents: write        # drafts the GitHub release
    name: create-release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
      release_version: ${{ env.RELEASE_VERSION }}
    steps:
      - name: Get the release version from the tag (push)
        shell: bash
        if: env.RELEASE_VERSION == '' && github.event_name == 'push'
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version is: $version"
      - name: Get the release version from the tag (dispatch)
        shell: bash
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          echo "RELEASE_VERSION=$INPUT_RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "version is: $INPUT_RELEASE_VERSION"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Create GitHub release
        id: release
        if: github.event.inputs.create_release == 'true' || github.event_name == 'push'
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          draft: true
          tag_name: ${{ env.RELEASE_VERSION }}
          release_name: ${{ env.RELEASE_VERSION }}

  build-release:
    permissions:
      contents: write        # uploads the release archives
    name: build-release
    needs: create-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        name:
          [
            ubuntu-latest,
            ubuntu-arm-latest,
            macOS-arm-latest,
            macOS-latest,
            windows-latest,
          ]
        rust: [stable]
        include:
          - name: ubuntu-arm-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: aarch64
            target: linux-aarch64
            cargo_targets: "aarch64-unknown-linux-musl"
            runner: [self-hosted, linux, ARM64]
          - name: ubuntu-latest
            os: ubuntu-latest
            release-os: linux
            release-arch: amd64
            target: linux-x86_64
            cargo_targets: "x86_64-unknown-linux-musl"
            runner: [self-hosted, linux, X64]
          - name: macOS-latest
            os: macOS-latest
            release-os: darwin
            release-arch: x86_64
            target: darwin-x86_64
            cargo_targets: "x86_64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
          - name: macOS-arm-latest
            os: macOS-latest
            release-os: darwin
            release-arch: aarch64
            target: darwin-aarch64
            cargo_targets: "aarch64-apple-darwin"
            runner: [self-hosted, macOS, ARM64]
          # TODO: windows runner is not available on the org level
          - name: windows-latest
            os: windows-latest
            release-os: windows
            release-arch: amd64
            target: windows-x86_64
            cargo_targets: "x86_64-pc-windows-msvc"
            runner: [windows-latest]
    steps:
      - name: Checkout repository
        if: inputs.base_hash == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout specified commit
        if: inputs.base_hash != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.base_hash }}
          fetch-depth: 1

      - name: Set build arch
        shell: bash
        run: |
          echo "RELEASE_ARCH=${{ matrix.release-arch }}" >> $GITHUB_ENV
          echo "RELEASE_OS=${{ matrix.release-os }}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.cargo_targets }}

      - name: Ensure musl support
        if: ${{ contains(matrix.cargo_targets, '-musl') }}
        run: sudo apt-get install musl-tools -y

      - name: Build release binary (unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          BUILD_IROH_SERVICES_API_SECRET: ${{ secrets.BUILD_IROH_SERVICES_API_SECRET }}
        run: |
          if [ "${{ matrix.name }}" = "ubuntu-arm-latest" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            export CC=aarch64-linux-gnu-gcc
          fi
          if [ "${{ contains(matrix.cargo_targets, '-musl') }}" = "true" ]; then
            export RUSTFLAGS="${RUSTFLAGS:-} -C target-feature=+crt-static -C relocation-model=static -C link-arg=-static"
          fi
          cargo build --locked --release --target ${{ matrix.cargo_targets }}

      - name: Build release binary (windows)
        if: matrix.os == 'windows-latest'
        env:
          BUILD_IROH_SERVICES_API_SECRET: ${{ secrets.BUILD_IROH_SERVICES_API_SECRET }}
        run: cargo build --locked --release --target ${{ matrix.cargo_targets }}

      - name: Cache AWS CLI
        if: matrix.os != 'windows-latest'
        id: cache-awscli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/awscli
          key: awscli-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Download awscli (linux x86_64)
        if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'amd64' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o ~/awscli/awscliv2.zip
          cd ~/awscli && unzip -oq awscliv2.zip

      - name: Download awscli (linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.release-arch == 'aarch64' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o ~/awscli/awscliv2.zip
          cd ~/awscli && unzip -oq awscliv2.zip

      - name: Download awscli (mac)
        if: matrix.os == 'macos-latest' && steps.cache-awscli.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/awscli
          curl "https://awscli.amazonaws.com/AWSCLIV2.pkg" -o ~/awscli/AWSCLIV2.pkg

      - name: Install awscli (linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo ~/awscli/aws/install --update

      - name: Install awscli (mac)
        if: matrix.os == 'macos-latest'
        run: sudo installer -pkg ~/awscli/AWSCLIV2.pkg -target /

      - name: Set AWS credentials
        if: matrix.os != 'windows-latest'
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-west-2" >> $GITHUB_ENV

      - name: Push release to S3
        if: matrix.os != 'windows-latest' && (github.event.inputs.upload_artifacts == 'true' || github.event_name == 'push')
        run: |
          aws s3 cp ./target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }} \
            s3://vorc/${{ env.BIN_NAME }}-${RELEASE_OS}-${RELEASE_ARCH}-${GITHUB_SHA::7} --no-progress

      - name: Push latest to S3
        if: matrix.os != 'windows-latest' && (github.event.inputs.mark_latest == 'true' || github.event_name == 'push')
        run: |
          aws s3 cp ./target/${{ matrix.cargo_targets }}/release/${{ env.BIN_NAME }} \
            s3://vorc/${{ env.BIN_NAME }}-${RELEASE_OS}-${RELEASE_ARCH}-latest --no-progress

      - name: Build archive
        shell: bash
        env:
          VERSION: ${{ needs.create-release.outputs.release_version }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET: ${{ matrix.cargo_targets }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        run: |
          staging="$BIN_NAME-$VERSION-$TARGET"
          mkdir -p "$staging"
          if [ "$RUNNER_OS_NAME" = "windows-latest" ]; then
            cp "target/$CARGO_TARGET/release/$BIN_NAME.exe" "$staging/"
            cd "$staging"
            7z a "../$staging.zip" .
            echo "ASSET=$staging.zip" >> "$GITHUB_ENV"
          else
            cp "target/$CARGO_TARGET/release/$BIN_NAME" "$staging/"
            tar czf "$staging.tar.gz" -C "$staging" .
            echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"
          fi

      # gh is not installed on the self-hosted runners.
      - name: Upload release archive to GitHub
        if: github.event.inputs.upload_artifacts == 'true' || github.event_name == 'push'
        uses: n0-computer/actions-upload-release-asset@2613dacb5369f21a7e14f8eedce32ea9f88bb19f # main
        with:
          upload_url: ${{ github.event.inputs.upload_url || needs.create-release.outputs.upload_url }}
          asset_path: ${{ env.ASSET }}
          overwrite: true

  publish-install-script:
    name: publish-install-script
    needs: build-release
    runs-on: ubuntu-latest
    if: github.event.inputs.mark_latest == 'true' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set AWS credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.S3_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=us-west-2" >> $GITHUB_ENV
      - name: Upload install script to S3
        run: |
          aws s3 cp ./install.sh s3://vorc/pigeons-install.sh \
            --no-progress --content-type "text/plain"
