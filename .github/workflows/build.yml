name: Build cross-platform artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# Default to read-only; jobs that need more grant it explicitly.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64 (musl)
            runs-on: [self-hosted, linux, X64]
            target: x86_64-unknown-linux-musl
            ext: ""
          - name: Windows x86_64 (MSVC)
            runs-on: [self-hosted, windows, X64]
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macOS ARM64
            runs-on: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install rust stable (unix)
        if: runner.os != 'Windows'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.platform.target }}

      - name: Install rust stable (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.platform.target }}

      - name: Build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: cargo build --locked --release --target ${{ matrix.platform.target }}

      - name: Build (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --locked --release --target ${{ matrix.platform.target }}

      - name: Prepare binary (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="pigeons"
          TARGET="${{ matrix.platform.target }}"

          if [[ "${TARGET}" == *"linux"* ]]; then
            OUT_EXT=".linux"
          else
            OUT_EXT=".macos"
          fi

          SRC="target/${TARGET}/release/${BIN_NAME}"
          OUTDIR="dist/${TARGET}"
          mkdir -p "${OUTDIR}"
          if [ ! -f "${SRC}" ]; then
            echo "Built binary not found: ${SRC}"
            exit 1
          fi
          cp "${SRC}" "${OUTDIR}/${BIN_NAME}${OUT_EXT}"
          chmod +x "${OUTDIR}/${BIN_NAME}${OUT_EXT}"
          ls -la "${OUTDIR}"

      - name: Prepare binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinName = "pigeons"
          $Target = "${{ matrix.platform.target }}"
          $Src = "target/$Target/release/$BinName.exe"
          $OutDir = "dist/$Target"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          if (-not (Test-Path $Src)) {
            Write-Error "Built binary not found: $Src"
            exit 1
          }
          Copy-Item $Src "$OutDir/$BinName.exe"
          Get-ChildItem $OutDir

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pigeons-${{ matrix.platform.target }}
          path: dist/${{ matrix.platform.target }}/*
          retention-days: 2

  test:
    name: Test ${{ matrix.platform.name }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.platform.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64 (musl)
            runs-on: [self-hosted, linux, X64]
            target: x86_64-unknown-linux-musl
            ext: ".linux"
          - name: Windows x86_64 (MSVC)
            runs-on: [self-hosted, windows, X64]
            target: x86_64-pc-windows-msvc
            ext: ".exe"
          - name: macOS ARM64
            runs-on: [self-hosted, macOS, ARM64]
            target: aarch64-apple-darwin
            ext: ".macos"

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pigeons-${{ matrix.platform.target }}
          path: dist/${{ matrix.platform.target }}

      - name: Setup SSH Server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
          sudo systemctl status ssh

      - name: Setup SSH Server (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          sudo systemsetup -setremotelogin on
          sleep 2

      - name: Setup SSH Server (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          Set-Service -Name sshd -StartupType 'Automatic'
          Get-Service sshd

      - name: Set execute permissions (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/${{ matrix.platform.target }}/pigeons${{ matrix.platform.ext }}

      - name: Run integration test (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail

          BIN_PATH="dist/${{ matrix.platform.target }}/pigeons${{ matrix.platform.ext }}"

          echo "Starting pigeons roost..."
          "$BIN_PATH" roost --ephemeral > server_output.txt 2>&1 &
          SERVER_PID=$!

          echo "Waiting for roost to be ready..."
          for i in {1..30}; do
            if grep -q 'roost is running' server_output.txt 2>/dev/null; then
              echo "Roost is ready"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "ERROR: Roost process died"
              cat server_output.txt
              exit 1
            fi
            sleep 1
          done

          cat server_output.txt

          ENDPOINT_ID=$(grep 'roost is running' server_output.txt | sed 's/.*id: //' || true)

          if [ -z "$ENDPOINT_ID" ]; then
            echo "ERROR: Could not extract endpoint ID from roost output"
            cat server_output.txt
            kill $SERVER_PID || true
            exit 1
          fi

          echo "Endpoint ID: $ENDPOINT_ID"

          echo "Attempting to fly..."
          set +e
          if command -v timeout > /dev/null; then
            timeout 10s ssh -o "StrictHostKeyChecking=no" -o "UserKnownHostsFile=/dev/null" -o "BatchMode=yes" -o "ProxyCommand=$BIN_PATH fly --stdio $ENDPOINT_ID" localhost echo "test" 2>&1 | tee connect_output.txt
            EXIT_CODE=$?
          else
            (sleep 10; kill $$ 2>/dev/null) &
            TIMEOUT_PID=$!
            ssh -o "StrictHostKeyChecking=no" -o "UserKnownHostsFile=/dev/null" -o "BatchMode=yes" -o "ProxyCommand=$BIN_PATH fly --stdio $ENDPOINT_ID" localhost echo "test" 2>&1 | tee connect_output.txt
            EXIT_CODE=$?
            kill $TIMEOUT_PID 2>/dev/null || true
          fi
          set -e

          echo "ssh exit code: $EXIT_CODE"

          # A crash in roost or in the `fly` proxy command tears the tunnel down,
          # and ssh then reports the connection as closed by the remote host.
          # That message used to count as a pass, so a panic that reproduced on
          # every run still went green. Check for it before anything else.
          if grep -qE 'panicked at|assertion failed' server_output.txt connect_output.txt; then
            echo "FAILURE: pigeons panicked"
            echo "--- roost output ---"
            cat server_output.txt
            echo "--- ssh output ---"
            cat connect_output.txt
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          if ! kill -0 $SERVER_PID 2>/dev/null; then
            echo "FAILURE: roost exited during the connection attempt"
            echo "--- roost output ---"
            cat server_output.txt
            exit 1
          fi

          # Being rejected at publickey/password means the tunnel carried the SSH
          # handshake end to end. The runner has no authorized key, so that is as
          # far as a healthy run gets.
          if grep -qiE 'permission denied|publickey|authentication failed' connect_output.txt; then
            echo "SUCCESS: Connection reached SSH authentication stage"
            kill $SERVER_PID || true
            exit 0
          fi

          echo "FAILURE: connection never reached SSH authentication"
          echo "--- roost output ---"
          cat server_output.txt
          echo "--- ssh output ---"
          cat connect_output.txt
          kill $SERVER_PID || true
          exit 1

      - name: Run integration test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Continue"

          $BinPath = "dist/${{ matrix.platform.target }}/pigeons${{ matrix.platform.ext }}"

          Write-Host "Starting pigeons roost..."
          $ServerJob = Start-Job -ScriptBlock {
            param($Path)
            & $Path roost --ephemeral
          } -ArgumentList (Resolve-Path $BinPath).Path

          Start-Sleep -Seconds 5

          $ServerOutput = Receive-Job -Job $ServerJob
          Write-Host "Roost output:"
          Write-Host $ServerOutput

          $IdMatch = ($ServerOutput | Select-String -Pattern 'roost is running! id: ([a-z0-9]+)').Matches
          if ($IdMatch.Count -eq 0) {
            Write-Host "ERROR: Could not extract endpoint ID"
            Stop-Job -Job $ServerJob
            Remove-Job -Job $ServerJob
            exit 1
          }

          $EndpointId = $IdMatch[0].Groups[1].Value
          Write-Host "Endpoint ID: $EndpointId"

          Write-Host "Attempting to fly..."
          $BinFullPath = (Resolve-Path $BinPath).Path
          $ConnectOutput = ssh -o "StrictHostKeyChecking=no" -o "UserKnownHostsFile=NUL" -o "BatchMode=yes" -o "ProxyCommand=$BinFullPath fly --stdio $EndpointId" localhost "echo test" 2>&1 | Out-String
          $ExitCode = $LASTEXITCODE

          Write-Host "Connect output:"
          Write-Host $ConnectOutput
          Write-Host "ssh exit code: $ExitCode"

          # Fold in whatever roost logged while the connection was attempted.
          $AllServerOutput = ($ServerOutput | Out-String) + (Receive-Job -Job $ServerJob | Out-String)

          # A crash in roost or in the `fly` proxy command tears the tunnel down,
          # and ssh then reports the connection as closed by the remote host.
          # That message used to count as a pass, so a panic that reproduced on
          # every run still went green. Check for it before anything else.
          if (($AllServerOutput -match 'panicked at|assertion failed') -or ($ConnectOutput -match 'panicked at|assertion failed')) {
            Write-Host "FAILURE: pigeons panicked"
            Write-Host "--- roost output ---"
            Write-Host $AllServerOutput
            Stop-Job -Job $ServerJob
            Remove-Job -Job $ServerJob
            exit 1
          }

          if ($ServerJob.State -ne 'Running') {
            Write-Host "FAILURE: roost exited during the connection attempt (state: $($ServerJob.State))"
            Write-Host "--- roost output ---"
            Write-Host $AllServerOutput
            Remove-Job -Job $ServerJob -Force
            exit 1
          }

          # Being rejected at publickey/password means the tunnel carried the SSH
          # handshake end to end. The runner has no authorized key, so that is as
          # far as a healthy run gets.
          if ($ConnectOutput -match 'permission denied|publickey|authentication failed') {
            Write-Host "SUCCESS: Connection reached SSH authentication stage"
            Stop-Job -Job $ServerJob
            Remove-Job -Job $ServerJob
            exit 0
          }

          Write-Host "FAILURE: connection never reached SSH authentication"
          Write-Host "--- roost output ---"
          Write-Host $AllServerOutput
          Stop-Job -Job $ServerJob
          Remove-Job -Job $ServerJob
          exit 1
